<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login.html</title>
</head>
<body>
    <h1 align="center">login form</h1>
    <center>
        <form id="login">
            
            <input type="Email" placeholder="Enter Your Email" id="email"
             style="padding: 5px 30px;"><br> <br>
            <input type="password" placeholder="Enter Your Password" id="pass"
             style="padding: 5px 30px;"><br> <br>

            <button type="submit" id="btn" style="padding: 5px 10px; background-color:
             brown; color: white; outline: none; border: none;
              cursor: pointer;">Submit</button>
        </form>
    </center>




    <script>
        let login = document.getElementById("login")

        login.addEventListener("submit" , function(e){
            e.preventDefault()
                let email = document.getElementById("email").value
                let pass = document.getElementById("pass").value
                
                let users = JSON.parse(localStorage.getItem("users")) || [];
                let foundUser = users.find(u=> u.email === email && u.pass === pass)

                if(foundUser){
                    localStorage.setItem("loggedInUser",JSON.stringify(foundUser))

                    alert("Login Completed")
                    location.assign('welcome.html')

                }
                else{
                    alert("email id or password incorrect")
                    window.location.href = "longin.html"
                }
            
        })
    </script>
</body>
</html>
